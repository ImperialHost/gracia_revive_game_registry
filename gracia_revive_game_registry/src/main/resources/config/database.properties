# =================================================
# DATABASE CONFIGURATION / CONFIGURARE BAZĂ DE DATE
# =================================================

# ===============================
# CONNECTION MODE / MOD CONEXIUNE
# ===============================
# RO: Alege modul de conectare: ipv4 sau ipv6
# EN: Choose connection mode: ipv4 or ipv6
# Default:ipv4
# Implicit:ipv4 
db.mode=ipv4


# ====================
# IPv4 JDBC CONNECTION
# ====================
# RO: Conexiune prin IPv4 (localhost clasic)
# EN: Connection using IPv4 (classic localhost)
db.url.ipv4=jdbc:mariadb://127.0.0.1:3306/gracia_revive_login?sslMode=DISABLED


# ====================
# IPv6 JDBC CONNECTION
# ====================
# RO: Conexiune prin IPv6 (loopback IPv6)
# EN: Connection using IPv6 (IPv6 loopback)
db.url.ipv6=jdbc:mariadb://[::1]:3306/gracia_revive_login?sslMode=DISABLED


# =======================================
# DATABASE USER / UTILIZATOR BAZĂ DE DATE
# =======================================
# RO: NU folosi root! Creează un user dedicat
# EN: DO NOT use root! Create a dedicated user
db.user=root


# =================
# PASSWORD / PAROLĂ
# =================
# RO: Parola pentru user-ul bazei de date
# EN: Password for the database user
db.password=


# ================================================
# CONNECTION POOL SIZE / DIMENSIUNE POOL CONEXIUNI
# ================================================
# RO: Numărul maxim de conexiuni simultane
# EN: Maximum number of simultaneous connections
db.pool.size=10

# ============================================
# CONNECTION POOL NAME / NUMELE POOL CONEXIUNI
# ============================================
# Default:GraciaRevive-DB-Pool
# Implicit:GraciaRevive-DB-Pool 
db.pool.name=GraciaRevive-DB-Pool

